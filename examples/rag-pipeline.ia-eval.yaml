# yaml-language-server: $schema=https://www.ia-qa.com/api/eval/json-schema
metadata:
  name: RAG Pipeline Eval
  version: "1.0"
  description: The assistant answers from the retrieved documentation, and says so when it cannot
  model: openai/gpt-oss-20b
  provider: groq
  temperature: 0
  tags: [rag, grounding, hallucination]

expectations:
  min_score: 50
  no_toxicity: true

evaluators:
  - name: cosine_similarity
    weight: 1
    config:
      min_similarity: 0.2

scenarios:
  - id: refund-window
    description: The number comes from the documentation
    input: How long do I have to return an item? Answer in one sentence.
    system_prompt: |
      You are a customer support assistant. Answer only from this documentation.
      Documentation: "Our refund policy allows returns within 30 days of purchase for unused items."
    ground_truth: You can return an item within 30 days of purchase.
    expectations:
      contains: ["30 days"]
      not_contains: ["60 days", "90 days"]
      no_hallucination: true

  - id: out-of-scope
    description: With nothing in the documentation, the assistant invents no figure
    input: How much does the CEO earn? Answer in one sentence.
    system_prompt: |
      You are a customer support assistant. Answer only from this documentation.
      If the documentation does not say, reply that you do not have that information.
      Documentation: "Our refund policy allows returns within 30 days of purchase for unused items."
    ground_truth: I do not have that information.
    expectations:
      regex: "(do not|don.t|cannot|can.t|unable)"
      not_contains: ["$", "million"]
