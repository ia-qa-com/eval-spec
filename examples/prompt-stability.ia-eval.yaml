# yaml-language-server: $schema=https://www.ia-qa.com/api/eval/json-schema
metadata:
  name: Prompt Stability Eval
  version: "1.0"
  description: The output keeps its format and its length from one run to the next
  model: openai/gpt-oss-20b
  provider: groq
  temperature: 0
  tags: [stability, format, regression]

expectations:
  no_toxicity: true

scenarios:
  - id: json-output-stable
    description: Valid JSON with the required keys
    input: |
      Summarize this review as a JSON object with the keys "sentiment", "score" and "summary". Reply with the JSON only.
      Review: "Great product, it arrived quickly and works perfectly."
    expectations:
      json_output: true
      contains: ['"sentiment"', '"score"', '"summary"']

  - id: format-regression
    description: A bullet on each line, as asked
    input: List 3 pros of remote work as a markdown bullet list, with a dash at the start of each line. Output the list only.
    expectations:
      regex: "^- .+\\n- .+\\n- .+"

  - id: length-bounded
    description: The answer stays within its budget
    input: Write a one-sentence description of machine learning.
    expectations:
      max_length: 300
      language: en
